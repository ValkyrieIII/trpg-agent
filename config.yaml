world:
  name: "诡秘之主 — 鲁恩王国"
  description: >
    第五纪1350年，蒸汽与机械的时代。你身处鲁恩王国首都贝克兰德，
    一座烟雾缭绕的巨城。煤气灯在黄昏中亮起，马车在石板路上辚辚而过，
    工厂的烟囱向灰色的天空吐出黑烟。在这工业文明的表象之下，
    非凡者的世界在暗处涌动——七大教会的非凡者、隐秘组织的成员、
    以及和你一样偶然踏入这个世界的低序列非凡者，都在这个
    蒸汽与神秘交织的时代中挣扎求存。

